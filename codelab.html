<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-color:white;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            background-color:#12203a;
            height: 70px;
            width: 100%;
            color: white;
        }

        .logo {
            color:white;
            font-size: 24px;
            font-weight: bold;
        }

        .link {
            display: flex;
            align-items: center;
            gap: 30px;
            list-style: none;
            color: white;
        }

        .link a {
            text-decoration: none;
            color: white;
            font-size: 16px;
        }

        .link a:hover {
            color: blue;
        }

        /* Main section */
        .main {
            display: flex;
            gap: 20px;
            background-color: #2e5bea

        }

        .text {
            /* background-color: white; */
            width:100%;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;

        }

        .text h1 {
            color: white;
            font-size: 40px;
            margin-bottom: 20px;
        }

        .text p {
            line-height: 1.7;
            color: white;
        }

        .pic {
            width: 50%;
            height: 500px;
            overflow: hidden;
            background-color: rgb(131, 169, 55);
        }

        #photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
 
        .navbtn{
            color: rgb(9, 9, 9);
            padding:10px 8px;
            background-color: #ffb703;
            border-radius :5px;
        }
       
        .skills{
            display: flex;
            justify-content: space-around;
            padding: 20px;
             grid-template-columns:1fr 1fr 1fr 1fr;
            grid-template-rows:  1fr;
            display: grid;
            gap: 30px;
        }

        .box{
            color:black;
            height: 10vh;
            width: 18vw;
            border-radius: 10px;
            background-color:rgb(199, 194, 194);
            text-align: center;
            padding: 20px;
            
        }
        /* Mobile responsive */
        @media (max-width: 768px) {
           
           

            .link {
                gap: 15px;
                flex-wrap: wrap;
            }

            .link a {
                font-size: 14px;
            }

            .main {
                flex-direction: column;
            }

            .text,
            .pic {
                width: 100%;
            }

            .text {
                min-height: auto;
                padding: 25px;
            }

            .pic {
                height: 350px;
            }
        }
         @media(min-width:500px){
                .skills{
            
            grid-template-rows: 1fr;
            grid-template-columns:1fr 1fr 1fr 1fr;
            
           
                }
            }
            @media(max-width :500px){
                .skills{
                grid-template-rows :1fr 1fr 1fr 1fr ;
                grid-template-columns: 1fr;
                font-size: small;
            }
        }
        .button{
            color: rgb(9, 9, 9);
            padding:10px 8px;
            width: 120px;
            background-color: #ffb703;
            border-radius :5px;
        }
    </style>
</head>

<body>
    <nav class="container">
        <div class="logo">MyWebsite</div>
        
        <ul class="link">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#courses">Courses</a></li>
            <li><a href="#contact">Contact Us</a></li>
        </ul>

        <div class="btn"> 
            <button class="navbtn">SignUp</button>
        </div>
    </nav>

    <main class="main" id="home">
        <section class="text" id="about">
            <h1> Lern Web Devlopment</h1>
            <p>
                Start from zero.Build real projects
            </p>
            <div>
            <button class="button">Get started</button></div>
        </section>
    </main>
    <div class="skills">
            <div class=" box html">HTML <br>
                Build the structure
            </div>
            <div class=" box css">CSS
                <br>
                Make Website Beautiful
            </div>
            <div class=" box js">JavaScript
                <br>
                Make it Smart
            </div>
            <div class=" box git">Git 
                <br>
                Save your Work
            </div>
        </div>
</body>
</html>
